[package]
name = "system-dashboard"
version = "0.1.0"
edition = "2024"
description = "Real-time system monitoring dashboard backend"

[dependencies]
axum = { version = "^0.8", features = ["query", "ws"] }
tokio = { version = "^1.35", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
sysinfo = "^0.39"
chrono = "^0.4"
nvml-wrapper = "^0.12"
nix = { version = "^0.29", features = ["fs", "term", "process"] }
libc = "^0.2"
reqwest = { version = "^0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
